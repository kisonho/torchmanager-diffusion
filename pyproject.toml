[tool.poetry]
name = "torchmanager-diffusion"
version = "1.3b1"
description = "Torchmanager Implementation for Diffusion Model (v1.3 Beta 1)"
authors = ["Kison Ho <unfit-gothic.0q@icloud.com>"]
packages = [
    { include = "diffusion" },
    { include = "diffusion_bridges" },
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
einops = "*"
torchmanager = { version = "^1.5", optional = true }
torchvision = "*"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1"

[tool.pyright]
include = ["diffusion", "diffusion_bridges", "data", "tests", "train.py", "eval.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
